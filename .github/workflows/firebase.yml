# CI/CD for the Firebase half of BairX (rules, indexes, Cloud Functions).
# The static site itself is deployed by Vercel's Git integration (every push to main →
# production, every other branch → preview); this workflow does not touch Vercel.
#
#  - Every pull request / push: syntax check, unit tests, Firestore rules tests (emulator).
#  - Push to main: deploy to Firebase ONLY after a manual approval on the "production"
#    environment (GitHub → Settings → Environments → production → Required reviewers).
#
# Credentials never live in the repo. Add one repository/environment secret:
#   FIREBASE_SERVICE_ACCOUNT — JSON key of a service account with roles
#   Firebase Admin + Cloud Functions Admin + Service Account User (see docs/DEPLOY.md).
name: firebase

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Syntax check
        run: for f in js/*.js functions/*.js functions/scripts/*.js sw.js tests/*.js; do node --check "$f"; done
      - name: Install test deps
        working-directory: tests
        run: npm ci
      - name: Unit tests (pricing formulas)
        working-directory: tests
        run: npm run test:unit
      - name: Install Firebase CLI + function deps
        run: |
          npm install -g firebase-tools@15
          cd functions && npm ci && node -e "require('fs').copyFileSync('../js/pricing.js','pricing.js')"
      - name: Firestore + Storage rules tests (emulator)
        working-directory: tests
        run: npm run test:rules
      - name: Browser tests — Chromium desktop/tablet/mobile (emulator, never production)
        working-directory: tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e-results
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production          # ← manual approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install functions deps
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Write service account (temp file, never committed)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA_JSON" || { echo "FIREBASE_SERVICE_ACCOUNT secret is not set"; exit 1; }
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy rules + indexes
        run: npx --yes firebase-tools@15 deploy --only firestore:rules,firestore:indexes,storage --project bairx-fd502 --non-interactive
      - name: Deploy Cloud Functions (requires Blaze plan)
        run: npx --yes firebase-tools@15 deploy --only functions --project bairx-fd502 --non-interactive   # no --force: never auto-delete functions missing from source
      - name: Remove service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
